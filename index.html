<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101112">
<title>حسابات | ACCOUNTS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Charcoal and gold. A deliberate single dark theme. */
:root{
  color-scheme:dark;
  --bg:#101112; --surface:#18191b; --raised:#202225;
  --line:#2e3033; --gold:#cfa84e; --gold-soft:#e8d29a; --gold-line:#6b5a2f;
  --text:#f1eee6; --muted:#aaa69c; --ok:#7fc59a; --bad:#ee8f84;
  --font:"IBM Plex Sans Arabic","SF Arabic","Geeza Pro","Noto Sans Arabic","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.7 var(--font)}
[hidden]{display:none!important}
h1,h2,p,dl,dd,ul{margin:0}
h1{font-size:1.45rem;line-height:1.4}
h2{font-size:1rem;font-weight:600;color:var(--gold-soft)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px}
main:focus{outline:none}
svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.skip{position:absolute;inset-inline-start:8px;top:-100px;background:var(--raised);padding:8px 12px;z-index:30}
.skip:focus{top:8px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--gold-line);background:var(--bg)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand strong{font-size:1.2rem;font-weight:700;color:var(--gold);line-height:1.5}
.brand small,.muted,.stage{color:var(--muted);font-size:.875rem}
.btn{min-height:48px;padding:8px 20px;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--text);font:600 .95rem var(--font);cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--gold-line)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#17130a}
.btn.lang{min-width:56px;border-color:var(--gold-line);color:var(--gold-soft)}
main{padding:16px;min-width:0}
main>section{display:flex;flex-direction:column;gap:16px}
.notice{padding:10px 14px;margin-bottom:16px;border:1px solid var(--gold-line);border-radius:10px;color:var(--gold-soft);font-size:.9rem}
.notice.bad{border-color:var(--bad);color:var(--bad)}
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.chip{border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:.8rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
/* The cash balance is the one framed element: cash is the only real money on screen. */
.vault{border:1px solid var(--gold-line);outline:1px solid var(--gold-line);outline-offset:-6px;border-radius:14px;padding:24px 20px;background:var(--surface)}
.balance{font-size:2.8rem;line-height:1.3;color:var(--gold);font-variant-numeric:tabular-nums}
.balance .cur{font-size:1rem;color:var(--muted)}
.formula{color:var(--muted);font-size:.875rem;padding-bottom:16px;border-bottom:1px solid var(--line)}
.rows .row,.flows .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.flows .row:first-child{border-top:0}
dt{min-width:0}
dd{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3;flex:none}
dd b{font-size:1.25rem}
dd small{color:var(--muted);font-size:.75rem}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.plan{list-style:none;padding:0}
.plan li{padding:12px 0;border-top:1px solid var(--line)}
label{font-weight:500}
input{min-height:48px;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:600 1.15rem var(--font)}
input[aria-invalid="true"]{border-color:var(--bad)}
.status:empty{display:none}
.status[data-state="ok"]{color:var(--ok)}
.status[data-state="bad"]{color:var(--bad)}
dialog{width:min(420px,calc(100% - 32px));border:1px solid var(--gold-line);border-radius:14px;background:var(--surface);color:var(--text);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.72)}
.actions{display:flex;gap:12px;margin-top:20px}
.actions .btn{flex:1}
#more-links a,#sidebar-links a{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px;border-radius:10px;color:var(--muted)}
#more-links a[aria-current],#sidebar-links a[aria-current]{background:var(--raised);color:var(--gold-soft)}
.sheet .btn{width:100%;margin-top:12px}
.toast{position:fixed;left:16px;right:16px;margin-inline:auto;max-width:420px;bottom:calc(88px + env(safe-area-inset-bottom,0px));padding:12px 16px;border:1px solid var(--ok);border-radius:10px;background:var(--raised);text-align:center;z-index:20;pointer-events:none}
.toast:empty{display:none}
.toast[data-state="bad"]{border-color:var(--bad)}
.noscript{margin:24px 16px;padding:16px;border:1px solid var(--bad);border-radius:10px;text-align:center}
html:not(.ready) .app{visibility:hidden}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* Names and accounts */
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
select{min-height:48px;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:500 1rem var(--font)}
.filters{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.btn:disabled{opacity:.5;cursor:default}
.user{overflow-wrap:anywhere;unicode-bidi:plaintext;text-align:start}
.person{gap:4px}
.person:hover{border-color:var(--gold-line)}
.person strong{font-size:1.15rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip.type{border-color:var(--gold-line);color:var(--gold-soft)}
.back{display:inline-flex;align-items:center;align-self:flex-start;min-height:44px;color:var(--gold-soft);text-decoration:underline}
.page-head h1{min-width:0}
.account{display:flex;flex-direction:column;gap:10px}
.account>div:first-child{display:flex;flex-direction:column;min-width:0}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}
.row-actions .btn{flex:1}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--gold-soft);font-weight:600}
.history{list-style:none;margin:0;padding:0}
.history li{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.history time{flex-basis:100%}
fieldset{margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;min-width:0}
.check{display:flex;align-items:center;gap:12px;min-height:48px}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--gold);flex:none}
a.count{display:flex;align-items:center;justify-content:center;min-width:48px;min-height:44px;color:var(--gold-soft);text-decoration:underline}
dialog{max-height:calc(100dvh - 32px);overflow:auto}
#form-dialog .actions{margin-top:0}
/* Money screens */
textarea{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:500 1rem var(--font);resize:vertical}
input[type="date"]{min-width:0;-webkit-appearance:none;appearance:none}
.money{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.money small{color:var(--muted);font-weight:400;font-size:.75em}
.rows .row.total{border-top:1px solid var(--gold-line)}
.row.total dt,.row.total .money{color:var(--gold);font-weight:700}
.rows dd{max-width:65%}
.count b{font-variant-numeric:tabular-nums;font-size:1.05rem}
.balance{overflow-wrap:anywhere}
.history li.entry{flex-direction:column;align-items:stretch;gap:6px}
.entry-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.entry.reversed .entry-head{opacity:.6;text-decoration:line-through}
.chip.warn{border-color:var(--bad);color:var(--bad)}
.history .chips{align-items:center}
.account-link{display:flex;flex-direction:column;justify-content:center;min-height:44px;min-width:0}
.account-link strong{color:var(--gold-soft);text-decoration:underline}
a.btn{display:flex;align-items:center;justify-content:center;text-align:center}
.context{display:flex;flex-direction:column;gap:2px}
.pair,.period{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn.file{display:flex;align-items:center;justify-content:center}
.btn.file:focus-within{outline:2px solid var(--gold-soft)}
.visually-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.btn.file input{min-height:0}
.note{margin:0}
details>.btn{margin-top:8px;width:100%}
/* Ledger: a table on wide screens, stacked cards on phones */
.ledger-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end}
.ledger-filters .wide{grid-column:1/-1}
.export-bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.export-bar .btn{padding-inline:6px}
.ledger-totals{gap:0}
.table-wrap{min-width:0}
table.ledger,.ledger tbody,.ledger tr,.ledger td{display:block;width:100%}
.ledger thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.ledger tr{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin-bottom:12px}
.ledger td{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:8px;padding:6px 0;align-items:center}
.ledger td::before{content:attr(data-label);color:var(--muted);font-size:.85rem}
.ledger td>div{min-width:0;overflow-wrap:anywhere}
.ledger .sub{font-size:.85rem}
.ledger .effect{unicode-bidi:isolate}
.ledger tr.st-reversed .money,.ledger tr.st-cancelled .money{text-decoration:line-through;opacity:.65}
.history .who{flex-basis:100%}
.print-only{display:none}
</style>
<style>
/* Phone first: bottom tab bar. Desktop: sidebar. */
.sidebar{display:none}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border:0;border-radius:10px;background:none;color:var(--muted);font:500 .74rem var(--font);cursor:pointer}
.tabbar [aria-current],.tabbar .active{color:var(--gold);background:var(--raised)}
@media (min-width:640px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flows{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
  .flows .row{border-top:0}
}
@media (min-width:960px){
  .app{display:grid;grid-template-columns:260px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
  .topbar{grid-column:1/-1;padding-inline:24px}
  .sidebar{display:flex;flex-direction:column;justify-content:space-between;gap:16px;padding:16px 12px;border-inline-end:1px solid var(--line)}
  .tabbar{display:none}
  main{padding:24px 32px 48px;width:100%;max-width:1040px}
  .toast{bottom:24px}
}
@media (min-width:640px){
  .filters{grid-template-columns:2fr 1fr}
  .account{flex-direction:row;justify-content:space-between;align-items:center}
  .row-actions .btn{flex:none}
}
@media (min-width:640px){
  .period{grid-template-columns:repeat(4,minmax(0,1fr));align-items:end}
  .account{flex-wrap:wrap}
  .account .row-actions{flex-basis:100%}
}
@media (min-width:640px){
  .ledger-filters{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media screen and (min-width:1200px){
  [data-page="ledger"]:not([hidden]){width:100%}
  table.ledger{display:table;border-collapse:collapse;table-layout:fixed;font-size:.88rem}
  .ledger thead{position:static;display:table-header-group;width:auto;height:auto;clip-path:none}
  .ledger tbody{display:table-row-group}
  .ledger tr{display:table-row;background:none;border:0}
  .ledger th,.ledger td{display:table-cell;width:auto;padding:10px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top;overflow-wrap:anywhere}
  .ledger th{color:var(--gold-soft);font-weight:600}
  .ledger td::before{content:none}
  .ledger .money{white-space:normal}
  main:has([data-page="ledger"]:not([hidden])){max-width:1500px}
}
@media print{
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--raised:#fff;--line:#999;--gold:#000;--gold-soft:#000;--gold-line:#999;--text:#000;--muted:#333;--bad:#000}
  @page{size:A4 landscape;margin:12mm}
  body{font-size:10pt}
  .topbar,.sidebar,.tabbar,.notice,.no-print,.toast,.skip,.page-head .chip{display:none!important}
  .app{display:block}
  main{padding:0;max-width:none}
  .print-only{display:block}
  table.ledger{display:table;border-collapse:collapse;width:100%}
  .ledger thead{position:static;display:table-header-group;width:auto;height:auto;clip-path:none}
  .ledger tbody{display:table-row-group}
  .ledger tr{display:table-row;border:0;break-inside:avoid}
  .ledger th,.ledger td{display:table-cell;width:auto;padding:4px;border:1px solid #999;text-align:start;vertical-align:top}
  .ledger td::before{content:none}
  .ledger a{color:#000;text-decoration:none;min-height:0}
  .ledger strong{color:#000!important;text-decoration:none!important}
}
</style>
</head>
<body>
<noscript><p class="noscript">يلزم فتح الملف في متصفح يشغّل JavaScript.<br><span dir="ltr">Open this file in a browser with JavaScript enabled.</span></p></noscript>
<div class="app">
<a class="skip" href="#main" data-i18n="a11y.skip"></a>
<header class="topbar">
  <div class="brand"><strong data-i18n="app.name"></strong><small data-i18n="app.tagline"></small></div>
  <button type="button" id="lang-btn" class="btn lang" data-i18n="lang.button" data-i18n-aria="lang.switch"></button>
</header>
<nav class="sidebar" data-i18n-aria="a11y.mainNav"><div id="sidebar-links"></div><p class="stage" data-i18n="app.stage"></p></nav>
<main id="main" tabindex="-1">
<p id="storage-banner" class="notice bad" data-i18n="prefs.storageBad" hidden></p>
<p id="data-banner" class="notice bad" role="alert" hidden></p>
<p class="notice" data-i18n="state.noData"></p>

<section data-page="dashboard">
  <header class="page-head"><h1 data-i18n="dash.title"></h1><span class="chip" data-i18n="app.stage"></span></header>
  <div class="vault">
    <h2 data-i18n="dash.cash"></h2>
    <p class="balance"><a href="#cash"><b data-total="balance">—</b></a> <span class="cur" data-i18n="cur.sar"></span></p>
    <p class="formula"><span data-i18n="dash.cashFormula"></span></p>
    <dl class="flows"><div class="row"><dt data-i18n="dash.received"></dt><dd><a class="count" href="#cash"><b data-total="received">—</b></a></dd></div><div class="row"><dt data-i18n="dash.paid"></dt><dd><a class="count" href="#cash"><b data-total="paid">—</b></a></dd></div></dl>
  </div>
  <p class="muted" data-i18n="dash.includesArchived"></p>
  <div class="grid">
    <section class="card"><h2 data-i18n="dash.agreements"></h2><dl class="rows"><div class="row"><dt data-i18n="dash.agreed"></dt><dd><a class="count" href="#accounts"><b data-total="agreed">—</b></a></dd></div><div class="row"><dt data-i18n="dash.remaining"></dt><dd><a class="count" href="#accounts"><b data-total="remaining">—</b></a></dd></div></dl></section>
    <section class="card"><h2 data-i18n="dash.monthly"></h2><dl class="rows"><div class="row"><dt data-i18n="dash.dues"></dt><dd><a class="count" href="#monthly"><b data-total="dues">—</b></a></dd></div><div class="row"><dt data-i18n="dash.shortfall"></dt><dd><a class="count" href="#monthly"><b data-total="shortfall">—</b></a></dd></div></dl></section>
    <section class="card"><h2 data-i18n="dash.directory"></h2><dl class="rows"><div class="row"><dt data-i18n="dash.names"></dt><dd><a class="count" href="#accounts"><b id="count-names">—</b></a></dd></div><div class="row"><dt data-i18n="dash.count"></dt><dd><a class="count" href="#accounts"><b id="count-accounts">—</b></a></dd></div></dl></section>
    <section class="card"><h2 data-i18n="dash.charts"></h2><p class="muted" data-i18n="dash.chartsNote"></p></section>
  </div>
</section>

<section data-page="accounts" hidden>
  <header class="page-head"><h1 data-i18n="nav.accounts"></h1><button type="button" id="add-person-btn" class="btn primary" data-i18n="people.add" disabled></button></header>
  <div class="filters">
    <div><label for="people-search" data-i18n="people.search"></label><input type="search" id="people-search" autocomplete="off" dir="auto"></div>
    <div><label for="people-filter" data-i18n="people.filter"></label><select id="people-filter">
      <option value="all" data-i18n="filter.all"></option><option value="agreement" data-i18n="type.agreement"></option>
      <option value="monthly" data-i18n="type.monthly"></option><option value="archived" data-i18n="filter.archived"></option></select></div>
  </div>
  <p id="people-count" class="muted" role="status"></p>
  <div id="people-list" class="grid"></div>
</section>
<section data-page="person" hidden><div id="person-view" class="stack"></div></section>

<section data-page="account" hidden><div id="account-view" class="stack"></div></section>

<section data-page="monthly" hidden>
  <header class="page-head"><h1 data-i18n="nav.monthly"></h1></header>
  <div class="period">
    <div><label for="p-month" data-i18n="field.month"></label><select id="p-month"></select></div>
    <div><label for="p-year" data-i18n="field.year"></label><select id="p-year"></select></div>
    <button type="button" id="p-prev" class="btn" data-i18n="months.prev"></button>
    <button type="button" id="p-next" class="btn" data-i18n="months.next"></button>
  </div>
  <button type="button" id="generate-btn" class="btn primary" data-i18n="months.generate" disabled></button>
  <div id="months-view" class="stack"></div>
</section>

<section data-page="cash" hidden>
  <header class="page-head"><h1 data-i18n="nav.cash"></h1></header>
  <div class="pair"><button type="button" id="cash-in-btn" class="btn primary" data-i18n="money.cashIn" disabled></button>
    <button type="button" id="cash-out-btn" class="btn" data-i18n="money.cashOut" disabled></button></div>
  <div id="cash-view" class="stack"></div>
  <details class="card"><summary data-i18n="cash.rules"></summary><ul class="plan"><li data-i18n="cash.r1"></li><li data-i18n="cash.r2"></li><li data-i18n="cash.r3"></li><li data-i18n="cash.r4"></li></ul></details>
</section>

<section data-page="ledger" hidden>
  <header class="page-head"><h1 data-i18n="nav.ledger"></h1></header>
  <p id="print-head" class="print-only"></p>
  <div class="ledger-filters no-print">
    <div class="wide"><label for="l-search" data-i18n="ledger.search"></label><input type="search" id="l-search" autocomplete="off" dir="auto"></div>
    <div><label for="l-person" data-i18n="field.name"></label><select id="l-person"></select></div>
    <div><label for="l-kind" data-i18n="ledger.kind"></label><select id="l-kind"></select></div>
    <div><label for="l-from" data-i18n="ledger.from"></label><input type="date" id="l-from" dir="ltr"></div>
    <div><label for="l-to" data-i18n="ledger.to"></label><input type="date" id="l-to" dir="ltr"></div>
    <div><label for="l-sort" data-i18n="ledger.sort"></label><select id="l-sort"><option value="newest" data-i18n="sort.newest"></option><option value="oldest" data-i18n="sort.oldest"></option><option value="largest" data-i18n="sort.largest"></option><option value="smallest" data-i18n="sort.smallest"></option></select></div>
    <button type="button" id="l-clear" class="btn" data-i18n="ledger.clear"></button>
  </div>
  <div class="export-bar no-print"><button type="button" id="l-csv" class="btn" data-i18n="ledger.csv" disabled></button><button type="button" id="l-xlsx" class="btn" data-i18n="ledger.xlsx" disabled></button><button type="button" id="l-print" class="btn" data-i18n="ledger.print" disabled></button></div>
  <p id="l-count" class="muted" role="status"></p>
  <div id="ledger-view" class="stack"></div>
  <details class="card no-print"><summary data-i18n="ledger.audit"></summary><div id="audit-view" class="stack"></div></details>
</section>

<section data-page="reports" hidden>
  <header class="page-head"><h1 data-i18n="nav.reports"></h1><span class="chip" data-i18n="state.phase" data-n="5"></span></header>
  <div class="card"><h2 data-i18n="state.planned"></h2><ul class="plan"><li data-i18n="reports.f1"></li><li data-i18n="reports.f2"></li><li data-i18n="reports.f3"></li><li data-i18n="reports.f4"></li></ul></div>
</section>
<section data-page="backup" hidden>
  <header class="page-head"><h1 data-i18n="nav.backup"></h1></header>
  <p class="notice" data-i18n="backup.private"></p>
  <div class="grid">

<script>
/* Input validation. Money is held as an integer number of halalas, never as a float. */
(function (root) {
  'use strict';
  const MAX_MINOR = 100000000000000; // 1 trillion SAR, well inside Number.MAX_SAFE_INTEGER

  function toLatinDigits(s) {
    return String(s)
      .replace(/[٠-٩]/g, (d) => String(d.charCodeAt(0) - 0x0660))
      .replace(/[۰-۹]/g, (d) => String(d.charCodeAt(0) - 0x06F0));
  }

  function parseAmount(input) {
    const fail = (error) => ({ ok: false, error });
    let s = toLatinDigits(input == null ? '' : input)
      .replace(/[‎‏؜]/g, '')   // invisible direction marks from copy/paste
      .replace(/٫/g, '.')                // Arabic decimal separator
      .replace(/٬/g, ',')                // Arabic thousands separator
      .trim();

<script>
/* The unified ledger: one row per financial event, each with its effect on what is owed and on cash.
   Adding up the effects of all rows gives exactly the current balances. No DOM here. */
(function (root) {
  'use strict';
  const node = typeof module !== 'undefined';
  const A = node ? require('./accounts.js') : root.ACC.accounts;
  const DEBT = { principal: 1, addition: 1, discount: -1, payment: -1, due_payment: -1, settlement: -1 };
  const CASH = { cash_in: 1, cash_out: -1 };
  const KINDS = ['principal', 'addition', 'discount', 'payment', 'due', 'due_cancel', 'due_payment', 'settlement', 'cash_in', 'cash_out'];

  function rows(s) {
    const accounts = new Map(s.accounts.map((a) => [a.id, a]));
    const people = new Map(s.people.map((p) => [p.id, p]));
    const dues = new Map(s.dues.map((d) => [d.id, d]));
    const byId = new Map(s.entries.map((e) => [e.id, e]));
    const reversed = new Set(s.entries.filter((e) => e.reversesId).map((e) => e.reversesId));
    const out = [];
    const add = (accountId, fields) => {
      const a = accounts.get(accountId);
      out.push(Object.assign({ order: out.length, account: a, person: people.get(a.personId), entry: null, source: null,
        description: '', notes: '', period: null, status: 'normal' }, fields));
    };
    for (const d of s.dues) {
      add(d.accountId, { id: d.id, kind: 'due', date: d.period + '-01', period: d.period, amount: d.amount,
        debt: d.amount, cash: 0, createdAt: d.createdAt, status: d.cancelledAt ? 'cancelled' : 'normal' });
      if (d.cancelledAt) add(d.accountId, { id: d.id + 'c', kind: 'due_cancel', date: A.localDate(new Date(d.cancelledAt)),
        period: d.period, amount: d.amount, debt: -d.amount, cash: 0, createdAt: d.cancelledAt });
    }
    for (const e of s.entries) {
      const sign = e.reversesId ? -1 : 1;
      const src = e.sourceId ? byId.get(e.sourceId) : null;
      add(e.accountId, { id: e.id, entry: e, source: src, kind: e.kind, date: e.date, amount: e.amount,
        debt: (DEBT[e.kind] || 0) * sign * e.amount, cash: (CASH[e.kind] || 0) * sign * e.amount,
        description: e.description, notes: e.notes, createdAt: e.createdAt,
        period: e.dueId ? dues.get(e.dueId).period : null,
        status: e.reversesId ? 'reversal' : reversed.has(e.id) ? 'reversed' : 'normal' });
    }
    return out;
  }

  /* filter: { query, personId, kind, from, to }; names(row) supplies the shown account name for search. */
  function filter(list, f, names) {
    const q = A.fold(f.query || '');
    return list.filter((r) => (!f.personId || r.person.id === f.personId) &&
      (!f.kind || (f.kind === 'reversal' ? r.status === 'reversal' : r.kind === f.kind)) &&
      (!f.from || r.date >= f.from) && (!f.to || r.date <= f.to) &&
      (!q || [r.person.name, names ? names(r) : r.account.label, r.description, r.notes].some((x) => A.fold(x).includes(q))));
  }
  const SORTS = {
    newest: (a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt) || b.order - a.order,
    oldest: (a, b) => a.date.localeCompare(b.date) || a.createdAt.localeCompare(b.createdAt) || a.order - b.order,
    largest: (a, b) => b.amount - a.amount || SORTS.newest(a, b),
    smallest: (a, b) => a.amount - b.amount || SORTS.newest(a, b)
  };
  const sort = (list, by) => list.slice().sort(SORTS[by] || SORTS.newest);

    if (r.kind === 'cash_in') t.received += r.cash;
    if (r.kind === 'cash_out') t.paid -= r.cash;
    t.net += r.cash; return t;
  }, { received: 0, paid: 0, net: 0 });

  const api = { rows, filter, sort, cashTotals, KINDS };
  root.ACC = root.ACC || {};
  root.ACC.ledger = api;
  if (node) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

          resolve(req.result);
        };
        req.onerror = () => { clearTimeout(timer); reject(coded('err.dbUnavailable', req.error)); };
      });
      opening.catch(() => { opening = null; });
      return opening;
    }
    function read(raw) {
      if (raw === undefined) return domain.empty();
      const data = domain.migrate(raw);
      try { domain.check(data); } catch (e) { throw coded('err.dataInvalid', e); } // never overwrite what we cannot read
      return data;
    }
    async function load() {
      const db = await open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).get(KEY);
        tx.oncomplete = () => { try { resolve(read(req.result)); } catch (e) { reject(e); } };
        tx.onerror = tx.onabort = () => reject(coded('err.dbUnavailable', tx.error));
      });
    }
    /* One read-write transaction. work(os, raw) returns the result to report after commit. */
    async function write(work) {
      const db = await open();
      return new Promise((resolve, reject) => {
        let result, problem;
        const tx = db.transaction(STORE, 'readwrite', { durability: 'strict' });
        const os = tx.objectStore(STORE);
        const req = os.get(KEY);
        req.onsuccess = () => {
          try { result = work(os, req.result); }
          catch (e) { problem = e; tx.abort(); }
        };
        tx.oncomplete = () => resolve(result); // success is reported only after the commit
        tx.onabort = () => reject(problem && problem.code ? problem : coded('err.saveFailed', problem || tx.error));
      });
    }
    const mutate = (op, input) => write((os, raw) => {
      const result = domain.apply(read(raw), op, input);
      if (raw && raw.schema === 1) os.put(raw, 'snapshot-schema1'); // keep the pre-upgrade copy
      os.put(result.state, KEY);
      return result;
    });
    /* Replaces everything. The data being replaced is kept as the recovery copy in the SAME transaction.
       expected = text of the data the user saw when confirming; if it changed since, refuse. */
    const replace = (data, expected, same) => write((os, raw) => {
      const current = read(raw);
      if (same(current) !== expected) throw coded('err.stale');
      domain.check(data);
      os.put({ savedAt: new Date().toISOString(), data: current }, 'recovery');
      os.put(data, KEY);
      return { state: data };
    });
    async function recovery() {
      const db = await open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).get('recovery');
        tx.oncomplete = () => resolve(req.result || null);
        tx.onerror = tx.onabort = () => reject(coded('err.dbUnavailable', tx.error));
      });
    }
    return { load, mutate, replace, recovery };
  }

  root.ACC.repo = { create, DB };

/* Unified ledger screen: filters, sorting, export, printing and the change history. */
(function (root) {
  'use strict';
  function create(core) {

    const PAGE = 100;
    let shown = PAGE, printing = false, auditShown = PAGE;

    const kindName = (r) => (r.status === 'reversal' ? t('entry.reversalOf') + ' ' : '') + t('kind.' + r.kind);
    const rowAccount = (r) => accountName(r.account);
    const description = (r) => [r.description, r.period ? t('entry.forMonth') + ' ' + r.period : ''].filter(Boolean).join(' — ');
    const statusName = (r) => t('status.' + r.status);
    // isolate keeps the sign on the correct side of the number inside Arabic text
    const signed = (n) => '\u2066' + (n > 0 ? '+' : n < 0 ? '−' : '') + V.formatMinor(Math.abs(n)) + '\u2069';
    const debtLabel = (r) => t(r.account.type === 'agreement' ? 'effect.remaining' : 'effect.shortfall');
    function effectText(r) {
      const parts = [];
      if (r.debt) parts.push(debtLabel(r) + ' ' + signed(r.debt));
      if (r.cash) parts.push(t('effect.cash') + ' ' + signed(r.cash));
      return parts.join(' · ');
    }

    const filters = () => ({ query: $('#l-search').value, personId: $('#l-person').value, kind: $('#l-kind').value, from: $('#l-from').value, to: $('#l-to').value });
    const current = (s) => L.sort(L.filter(L.rows(s), filters(), rowAccount), $('#l-sort').value);

    function fillSelects(s) {
      const person = $('#l-person'), kind = $('#l-kind'), keepP = person.value, keepK = kind.value;
      person.replaceChildren(el('option', { value: '', text: t('ledger.allNames') }),
        ...s.people.slice().sort((a, b) => a.name.localeCompare(b.name, 'ar')).map((p) => el('option', { value: p.id, text: p.name })));
      kind.replaceChildren(el('option', { value: '', text: t('ledger.allKinds') }),
        ...L.KINDS.map((k) => el('option', { value: k, text: t('kind.' + k) })),
        el('option', { value: 'reversal', text: t('ledger.reversalsOnly') }));
      person.value = keepP; kind.value = keepK;
    }
    function rowActions(r) {
      const e = r.entry;
      if (!e || r.status !== 'normal' || r.account.archivedAt) return [];
      const list = [];
      if (T.PAYMENTS.includes(e.kind) && !T.linkedReceipt(core.getState(), e.id)) list.push(button('entry.receive', () => core.money().open('addReceiptFor', r.account, { entryId: e.id, entry: e })));
      list.push(button('entry.reverse', () => core.money().open('reverseEntry', r.account, { entryId: e.id, entry: e })));
      return list;
    }

      const note = (labelKey, text) => el('div', { class: 'sub' }, el('span', { class: 'muted', text: t(labelKey) + ': ' }), userText('span', text));
      const desc = [];

        cell('ledger.amount', core.money().money(r.amount)),
        cell('field.description', ...(desc.length ? desc : [el('span', { class: 'muted', text: '—' })])),

    }

      const s = core.getState(), box = $('#ledger-view');
      box.replaceChildren();
      ['#l-csv', '#l-xlsx', '#l-print'].forEach((id) => { $(id).disabled = !s; });

      if (!s) return;
      fillSelects(s);
      const rows = current(s), totals = L.cashTotals(rows), all = L.rows(s).length;
      $('#l-csv').disabled = $('#l-xlsx').disabled = $('#l-print').disabled = !rows.length;
      $('#l-count').textContent = t('ledger.shown', { n: rows.length, total: all });

      if (f.query) active.push(t('ledger.search') + ': ' + f.query);
      if (f.personId) active.push(t('field.name') + ': ' + $('#l-person').selectedOptions[0].textContent);
      if (f.kind) active.push(t('ledger.kind') + ': ' + $('#l-kind').selectedOptions[0].textContent);
      if (f.from) active.push(t('ledger.from') + ': ' + f.from);
      if (f.to) active.push(t('ledger.to') + ': ' + f.to);
      $('#print-head').textContent = [t('app.name'), t('nav.ledger'), formatDate(new Date().toISOString()), active.length ? active.join(' | ') : t('ledger.noFilter')].join(' — ');
      const sum = (key, value) => el('div', { class: 'row', 'data-k': key }, el('dt', { text: t(key) }), el('dd', {}, core.money().money(value)));
      box.append(el('dl', { class: 'card rows ledger-totals' }, sum('ledger.in', totals.received), sum('ledger.out', totals.paid), sum('ledger.net', totals.net)));
      if (!rows.length) { box.append(el('p', { class: 'card muted', text: t(all ? 'ledger.noMatch' : 'ledger.empty') })); }
      else {
        const heads = ['field.date', 'field.name', 'ledger.account', 'ledger.kind', 'ledger.amount', 'field.description', 'ledger.effect'];
        box.append(el('div', { class: 'table-wrap' }, el('table', { class: 'ledger' },
          el('thead', {}, el('tr', {}, ...heads.map((k) => el('th', { scope: 'col', text: t(k) })))),
          el('tbody', {}, ...rows.slice(0, printing ? rows.length : shown).map(tableRow)))));
        if (rows.length > shown && !printing) box.append(button('ledger.more', () => { shown += PAGE; render(); }, 'no-print'));
      }
      const events = s.audit.slice().reverse();
      $('#audit-view').append(el('ol', { class: 'history' }, ...events.slice(0, auditShown).map((e) => {
        const li = describe(e), p = s.people.find((x) => x.id === e.personId);
        if (p) li.prepend(userText('strong', p.name, 'user who'));
        return li;
      })));
      if (events.length > auditShown) $('#audit-view').append(button('ledger.more', () => { auditShown += PAGE; render(); }));
      if (!events.length) $('#audit-view').append(el('p', { class: 'muted', text: t('entry.none') }));
    }

    /* What is exported is exactly what the filters show, all of it, in the shown order. */
    function table(s) {
      const headers = ['field.date', 'field.name', 'ledger.account', 'ledger.kind', 'ledger.amount', 'ledger.debtEffect', 'ledger.cashEffect', 'ledger.status', 'field.description', 'field.notes', 'ledger.forMonth', 'ledger.recordedAt'].map((k) => t(k));
      return { headers, rows: current(s).map((r) => [{ date: r.date }, r.person.name, rowAccount(r), kindName(r), { money: r.amount }, { money: r.debt }, { money: r.cash }, statusName(r), r.description, r.status === 'reversal' ? '' : r.notes, r.period || '', r.createdAt]) };
    }
    function save(content, type, name) {
      const url = URL.createObjectURL(new Blob([content], { type }));
      const link = el('a', { href: url, download: name });
      document.body.append(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    function exportAs(kind) {
      try {
        const s = core.getState(), name = 'accounts-ledger-' + domain.localDate(new Date()) + '.' + kind;
        if (kind === 'csv') save(X.csv(table(s)), 'text/csv;charset=utf-8', name);
        else save(X.xlsx(table(s), t('nav.ledger'), getLang() === 'ar'), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', name);
        toast('toast.exportStarted', 'ok');
      } catch (e) { toast('err.exportFailed', 'bad'); }
    }

    function init() {
      const changed = () => { shown = PAGE; render(); };
      ['#l-search', '#l-from', '#l-to'].forEach((id) => $(id).addEventListener('input', changed));
      ['#l-person', '#l-kind', '#l-sort'].forEach((id) => $(id).addEventListener('change', changed));
      $('#l-clear').addEventListener('click', () => { ['#l-search', '#l-person', '#l-kind', '#l-from', '#l-to'].forEach((id) => { $(id).value = ''; }); $('#l-sort').value = 'newest'; changed(); });
      $('#l-csv').addEventListener('click', () => exportAs('csv'));
      $('#l-xlsx').addEventListener('click', () => exportAs('xlsx'));
      $('#l-print').addEventListener('click', () => window.print());
      window.addEventListener('beforeprint', () => { printing = true; render(); });
      window.addEventListener('afterprint', () => { printing = false; render(); });
    }
    return { init, render };
  }
  root.ACC.ledgerUI = { create };
})(window);
</script>
<script>
/* Screens for agreement accounts, monthly accounts, dashboard figures and cash receipts. */

    const { accounts: domain, transactions: T, monthly: M, validation: V } = root.ACC;
    const $ = (s) => document.querySelector(s);

      addAddition: { title: 'money.addition', f: ['amount', 'date', 'text'] },
      addDiscount: { title: 'money.discount', f: ['amount', 'date', 'text'] },
      addDuePayment: { title: 'money.duePayment', f: ['amount', 'date', 'text', 'cash'] },
      addSettlement: { title: 'money.settlement', f: ['amount', 'date', 'text', 'cash'] },
      setMonthlyAmount: { title: 'money.monthlyAmount', f: ['amount'] },
      createDue: { title: 'money.createDue', f: ['period', 'amount'] },
      reverseEntry: { title: 'money.reverse', f: ['reason'] },
      addReceiptFor: { title: 'money.receiveLater', f: ['date', 'text'], dateLabel: 'field.receiptDate' },
      addCashIn: { title: 'money.cashIn', f: ['who', 'amount', 'date', 'text'], help: 'money.cashInHelp' },
      addCashOut: { title: 'money.cashOut', f: ['who', 'amount', 'date', 'text'], help: 'money.cashOutHelp' }
    };
    /* Standalone cash is always linked to a name and an account chosen here. */
    function fillAccounts() {
      const s = core.getState(), id = $('#m-person').value;
      const list = s.accounts.filter((a) => a.personId === id && !a.archivedAt);
      $('#m-account').replaceChildren(el('option', { value: '', text: t('money.chooseAccount') }), ...list.map((a) => el('option', { value: a.id, text: accountName(a) })));
      if (list.length === 1) $('#m-account').value = list[0].id;
      whoChanged();
    }
    function whoChanged() {
      if (!form || !FORMS[form.op].f.includes('who')) return;
      const s = core.getState(), a = s.accounts.find((x) => x.id === $('#m-account').value);
      form.base.accountId = a ? a.id : '';
      // warn when this account has payments still waiting for their cash
      const waiting = a && form.op === 'addCashIn' && T.active(s, a.id).some((e) => T.PAYMENTS.includes(e.kind) && !T.linkedReceipt(s, e.id));
      $('#m-waiting').hidden = !waiting;
    }
    function limit(s) {
      const { op, base } = form;
      if (op === 'addPayment' || op === 'addDiscount') return T.agreement(s, base.accountId).remaining;
      if (op === 'addDuePayment') return M.maxDuePayment(s, s.dues.find((d) => d.id === base.dueId));
      if (op === 'addSettlement') return T.isDate($('#m-date').value) ? M.maxSettlement(s, base.accountId, $('#m-date').value) : null;
      return null;
    }
    function showLimit() {
      const s = core.getState(), max = form && s ? limit(s) : null, node = $('#m-limit');
      node.hidden = max === null;
      node.replaceChildren(...(max === null ? [] : [el('span', { text: t(form.op === 'addSettlement' ? 'money.maxSettlement' : 'money.max') + ' ' }), money(max)]));
    }
    function fillPeriod(selectMonth, selectYear, value) {
      const [y, m] = value.split('-');
      const now = Number(today().slice(0, 4)), years = [];
      for (let i = now; i >= Math.min(now - 6, Number(y)); i--) years.push(String(i));
      selectMonth.replaceChildren(...Array.from({ length: 12 }, (_, i) => {
        const v = String(i + 1).padStart(2, '0');
        return el('option', { value: v, text: new Intl.DateTimeFormat(locale(), { month: 'long', timeZone: 'UTC' }).format(new Date(Date.UTC(2000, i, 1))) });
      }));
      selectYear.replaceChildren(...years.map((v) => el('option', { value: v, text: v })));
      selectMonth.value = m; selectYear.value = y;

    function open(op, a, extra) {

      if (x.dueId) context.append(el('span', { text: monthName(s.dues.find((d) => d.id === x.dueId).period) }));
      if (x.entry) context.append(el('span', { text: t('kind.' + x.entry.kind) }), money(x.entry.amount),

      ['who', 'amount', 'period', 'date', 'text', 'cash', 'reason'].forEach((k) => { $('#mf-' + k).hidden = !cfg.f.includes(k); });
      $('#mf-dup').hidden = true;
      $('#m-date-label').textContent = t(cfg.dateLabel || 'field.date');
      $('#m-date').value = today(); $('#m-date').max = today(); $('#m-date').min = '2000-01-01';
      if (cfg.f.includes('period')) fillPeriod($('#m-month'), $('#m-year'), x.period || period);

        description: $('#m-desc').value, notes: $('#m-notes').value, reason: $('#m-reason').value,
        cash: cash ? cash.value : '', confirmDuplicate: !$('#mf-dup').hidden && $('#m-dup').checked

        if (e.code === 'err.dataRules') await core.refresh();
      } finally { busy = false; $('#money-save').disabled = false; }
    }

    async function run(op, input, doneKey, params) {
      try { await commit(op, input); toast(doneKey, 'ok', params); }
      catch (e) { toast(e.code || 'err.saveFailed', 'bad', e.params); await core.refresh(); }
    }
    const cancelDue = (d) => confirm('due.cancel', 'due.cancelConfirm', () => run('cancelDue', { dueId: d.id }, 'toast.saved'));

    /* ---------- account page ---------- */
    function entryItem(s, a, e, gone, readOnly) {
      const isReversal = !!e.reversesId, isReversed = gone.has(e.id);
      const li = el('li', { class: 'entry' + (isReversed ? ' reversed' : ''), 'data-kind': e.kind },
        el('div', { class: 'entry-head' }, el('strong', { text: (isReversal ? t('entry.reversalOf') + ' ' : '') + t('kind.' + e.kind) }), money(e.amount)));

        li.append(actions(
          T.PAYMENTS.includes(e.kind) && !receipt ? button('entry.receive', () => open('addReceiptFor', a, { entryId: e.id, entry: e })) : null,
          receipt ? reverse(receipt, 'entry.reverseReceipt') : null,

<script>
/* Backup page: export, inspect, replace after confirmation, and return to the replaced data. */
(function (root) {
  'use strict';
  function create(core) {
    const { t, toast, say, clearMessage, confirm, el, button, formatDate, prefs } = core;
    const { backup: B } = root.ACC;
    const $ = (s) => document.querySelector(s);
    let candidate = null, recovery = null, turn = 0;

    const fileName = () => 'accounts-backup-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json';
    const countsLine = (d) => t('backup.counts', B.counts(d));

    async function exportText() { return B.build(await core.repo.load()); }
    function exported(key) {
      prefs.save({ lastExport: new Date().toISOString() });
      say('export-result', key, 'ok');
      renderLast();
    }
    async function download() {
      try {
        const url = URL.createObjectURL(new Blob([await exportText()], { type: 'application/json' }));
        const link = el('a', { href: url, download: fileName() });
        document.body.append(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        exported('backup.downloadStarted'); // a page cannot confirm the file was actually saved
      } catch (e) { say('export-result', e.code || 'err.exportFailed', 'bad'); }
    }
    async function copy() {
      let text;
      try { text = await exportText(); }
      catch (e) { say('export-result', e.code || 'err.exportFailed', 'bad'); return; }
      const area = $('#export-text');
      try { await navigator.clipboard.writeText(text); area.hidden = true; exported('backup.copied'); }
      catch (e) { area.value = text; area.hidden = false; area.focus(); area.select(); exported('backup.copyManual'); }
    }

    async function inspect(text) {
      const mine = ++turn;
      candidate = null; clearMessage('import-result'); renderCandidate();
      try {
        const parsed = await B.parse(text);
        const current = await core.repo.load();
        if (mine !== turn) return;
        parsed.current = current;
        parsed.identical = parsed.checksum === await B.checksum(current);
        candidate = parsed;
        say('import-result', 'backup.valid', 'ok');
      } catch (e) { if (mine === turn) say('import-result', e.code || 'err.backupJson', 'bad'); }
      renderCandidate();
    }
    function renderCandidate() {
      const box = $('#import-preview');
      box.replaceChildren();
      if (!candidate) return;
      const c = candidate;
      box.append(el('p', { text: t('backup.exportedAt') + ' ' + formatDate(c.exportedAt) }),
        el('p', { text: t('backup.inFile') + ' ' + countsLine(c.data) }),
        el('p', { text: t('backup.onDevice') + ' ' + countsLine(c.current) }));
      if (c.identical) { box.append(el('p', { class: 'notice', text: t('backup.identical') })); return; }
      if ((prefs.load().imported || []).includes(c.checksum)) box.append(el('p', { class: 'notice bad', text: t('backup.importedBefore') }));
      const a = B.counts(c.data), b = B.counts(c.current);
      if (Object.keys(a).some((k) => a[k] < b[k]) || c.current.audit.length > c.data.audit.length) box.append(el('p', { class: 'notice bad', text: t('backup.fewer') }));
      box.append(button('backup.replace', () => confirm('backup.replace', 'backup.replaceConfirm', () => apply(c, true)), 'primary'));
    }
    async function apply(c, fromFile) {
      try {
        await core.replace(c.data, B.canonical(c.current), B.canonical);
        if (fromFile) prefs.save({ imported: (prefs.load().imported || []).concat(c.checksum).slice(-50) });
        candidate = null; renderCandidate(); clearMessage('import-result');
        $('#import-file').value = ''; $('#import-text').value = '';
        toast(fromFile ? 'toast.imported' : 'toast.recovered', 'ok');
      } catch (e) { toast(e.code || 'err.saveFailed', 'bad'); candidate = null; renderCandidate(); }
      await refresh();
    }
    function renderLast() {
      const at = prefs.load().lastExport;
      $('#last-export').textContent = at ? t('backup.last') + ' ' + formatDate(at) : t('backup.never');
    }
    function renderRecovery() {
      const box = $('#recovery-view');
      box.replaceChildren();
      if (!recovery) { box.append(el('p', { class: 'muted', text: t('backup.noRecovery') })); return; }
      box.append(el('p', { text: formatDate(recovery.savedAt) }), el('p', { text: countsLine(recovery.data) }),
        button('backup.recover', async () => {
          const current = await core.repo.load(), data = recovery.data;
          confirm('backup.recover', 'backup.recoverConfirm', () => apply({ data, current }, false));
        }));
    }
    async function refresh() {
      try { recovery = await core.repo.recovery(); } catch (e) { recovery = null; }
      renderRecovery();
    }
    function init() {
      $('#export-btn').addEventListener('click', download);
      $('#copy-btn').addEventListener('click', copy);
      $('#import-file').addEventListener('change', async () => {
        const file = $('#import-file').files[0];
        if (!file) return;
        if (file.size > 300 * 1024 * 1024) { say('import-result', 'err.backupLarge', 'bad'); return; }
        try { await inspect(await file.text()); } catch (e) { say('import-result', 'err.backupJson', 'bad'); }
      });
      $('#inspect-btn').addEventListener('click', () => inspect($('#import-text').value));
      $('#import-text').addEventListener('input', () => { turn++; candidate = null; renderCandidate(); clearMessage('import-result'); });
      refresh();
    }
    return { init, refresh, render() { renderLast(); renderCandidate(); renderRecovery(); } };
  }
  root.ACC.backupUI = { create };
})(window);
</script>

        section('person.archivedAccounts', mine.filter((a) => a.archivedAt), 'person.noArchived'),
        el('details', { class: 'card' }, el('summary', { text: t('person.history') }),
          el('ol', { class: 'history' }, ...state.audit.filter((e) => e.personId === p.id).reverse().map(describe))));
    }
    function renderStatus() {
      const banner = $('#data-banner');
      banner.hidden = !problem;
      banner.textContent = problem ? t(problem) : '';
      $('#add-person-btn').disabled = !state;
    }
    function render() { renderStatus(); renderCounts(); renderList(); renderPerson(); money.render(state); backups.render(); ledger.render(); }

    async function refresh() {
      try { state = await repo.load(); problem = null; }
      catch (e) { state = null; problem = e.code || 'err.dbUnavailable'; }
      render();
    }
    async function commit(op, input) {
      const result = await repo.mutate(op, input);
      state = result.state; problem = null;
      announce();
      // Ask the browser not to evict the data. It may refuse; Settings shows the answer.
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(showPersistence, () => {});
      render();
      return result.id;
    }
    function announce() { if (channel) channel.postMessage('changed'); }
    async function replace(data, expected, same) {
      state = (await repo.replace(data, expected, same)).state;
      problem = null; announce(); render();
    }
    function showPersistence(granted) {
      const node = $('#persist-status');
      node.dataset.i18n = granted ? 'data.persisted' : 'data.notPersisted';
      node.textContent = t(node.dataset.i18n);
    }

    function ask(op, a, titleKey, messageKey, doneKey) {
      confirm(titleKey, messageKey, async () => {
        try { await commit(op, { accountId: a.id }); toast(doneKey, 'ok'); }
        catch (e) { toast(e.code || 'err.saveFailed', 'bad'); await refresh(); }
      });
    }

    const FORMS = {
      addPerson: { title: 'people.add', name: true, types: true, done: 'toast.personAdded' },
      renamePerson: { title: 'person.rename', name: true, done: 'toast.renamed' },
      addAccount: { title: 'account.add', type: true, label: true, done: 'toast.accountAdded' },
      renameAccount: { title: 'account.editLabel', label: true, done: 'toast.labelSaved' }
    };
    function openForm(op, target) {
      const f = FORMS[op];
      $('#entity-form').reset();
      clearMessage('form-error');
      $('#form-title').textContent = t(f.title);
      $('#field-name').hidden = !f.name; $('#field-types').hidden = !f.types;
      $('#field-type').hidden = !f.type; $('#field-label').hidden = !f.label;
      const base = {};
      if (op === 'renamePerson') { base.personId = target.id; base.expected = target.name; $('#in-name').value = target.name; }
      if (op === 'addAccount') base.personId = target.id;
      if (op === 'renameAccount') { base.accountId = target.id; base.expected = target.label; $('#in-label').value = target.label; }
      formAction = { op, base, done: f.done };
      $('#form-dialog').showModal();
    }
    async function submit(event) {
      event.preventDefault();
      if (busy || !formAction) return; // a double tap must not save twice
      busy = true; $('#form-save').disabled = true;
      clearMessage('form-error');
      const { op, base, done } = formAction;
      const input = Object.assign({}, base, {
        name: $('#in-name').value, label: $('#in-label').value, type: $('#in-type').value,
        types: domain.TYPES.filter((x) => $('#in-' + x).checked)
      });
      try {
        const id = await commit(op, input);
        $('#form-dialog').close();
        toast(done, 'ok');
        if (op === 'addPerson') location.hash = 'person-' + id;
      } catch (e) {
        say('form-error', e.code || 'err.saveFailed', 'bad');
      } finally { busy = false; $('#form-save').disabled = false; }
    }

    function init() {
      $('#add-person-btn').addEventListener('click', () => openForm('addPerson'));
      $('#people-search').addEventListener('input', renderList);
      $('#people-filter').addEventListener('change', renderList);
      $('#entity-form').addEventListener('submit', submit);
      $('#form-cancel').addEventListener('click', () => $('#form-dialog').close());
      money.init(); backups.init(); ledger.init();
      if (channel) channel.onmessage = () => { refresh(); backups.refresh(); };
      window.addEventListener('pageshow', (e) => { if (e.persisted) refresh(); });
      if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(showPersistence, () => {});
      return refresh();
    }
    const core = { t, getLang, toast, say, clearMessage, confirm, prefs, el, userText, button, accountName, formatDate, commit, refresh, replace, repo, describe, money: () => money, getState: () => state };
    ledger = root.ACC.ledgerUI.create(core);
    money = root.ACC.financeUI.create(core);
    backups = root.ACC.backupUI.create(core);
    return { init, render, showPerson(id) { personId = id; renderPerson(); }, showAccount(id) { money.showAccount(id); } };
  }
  root.ACC.accountsUI = { create };
})(window);
</script>
<script>
/* Application shell: routing, language, dialogs and messages. */
(function () {
  'use strict';
  const { i18n, validation, storage } = window.ACC;
  const store = storage.create(() => window.localStorage);
  let lang = i18n.normalize(store.load().lang);
  const messages = {}; // result lines that must be re-translated on language change

  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const t = (k, p) => i18n.t(lang, k, p);

  const ICONS = {
    dashboard: 'M4 11l8-7 8 7v9h-5v-6H9v6H4z',
    accounts: 'M9 11a4 4 0 100-8 4 4 0 000 8zm-7 9c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 010 7m2 3c3 .6 4 3 4 6',
    monthly: 'M4 6h16v14H4zM4 10h16M8 3v5m8-5v5',
    cash: 'M3 7h18v11H3zM12 15a2.5 2.5 0 100-5 2.5 2.5 0 000 5z',
    ledger: 'M6 3h13v18H6zM9 8h7M9 12h7M9 16h4',
    reports: 'M4 20h16M7 20v-7m5 7V5m5 15v-10',
    backup: 'M12 4v11m-5-5l5 5 5-5M5 20h14',
    prefs: 'M4 7h10m4 0h2M4 17h4m4 0h8M16 5v4M10 15v4',
    more: 'M5 12h.01M12 12h.01M19 12h.01'
  };
  const icon = (n) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
  const ROUTES = ['dashboard', 'accounts', 'monthly', 'cash', 'ledger', 'reports', 'backup', 'prefs'];
  const TABS = ['dashboard', 'accounts', 'monthly', 'cash'];
  const SHORT = { accounts: 'nav.accountsShort', monthly: 'nav.monthlyShort' };

  function link(route, key) {
    return `<a href="#${route}" data-route="${route}">${icon(route)}<span data-i18n="${key}"></span></a>`;
  }
  function buildNav() {
    $('#sidebar-links').innerHTML = ROUTES.map((r) => link(r, 'nav.' + r)).join('');
    $('#tabbar').innerHTML = TABS.map((r) => link(r, SHORT[r] || 'nav.' + r)).join('') +
      `<button type="button" id="more-btn" aria-haspopup="dialog">${icon('more')}<span data-i18n="nav.more"></span></button>`;
    $('#more-links').innerHTML = ROUTES.filter((r) => !TABS.includes(r)).map((r) => link(r, 'nav.' + r)).join('');
  }

  let ui = null;

  function render() {
    const html = document.documentElement;
    html.lang = lang;
    html.dir = i18n.dir(lang);
    document.title = t('app.name');
    $$('[data-i18n]').forEach((el) => {
      el.textContent = t(el.dataset.i18n, el.dataset.n ? { n: el.dataset.n } : undefined);
    });
    $$('[data-i18n-aria]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
    Object.keys(messages).forEach(paint);
    renderStorage();
    if (ui) ui.render();
  }
  function renderStorage() {
    const ok = store.selfTest();
    const el = $('#storage-status');
    el.textContent = t(ok ? 'prefs.storageOk' : 'prefs.storageBad');
    el.dataset.state = ok ? 'ok' : 'bad';
    $('#storage-banner').hidden = ok;
  }

  function paint(id) {
    const m = messages[id], el = document.getElementById(id);
    el.textContent = m ? t(m.key, m.params) : '';
    el.dataset.state = m ? m.state : '';
  }
  function say(id, key, state, params) { messages[id] = { key, state, params }; paint(id); }

  let toastTimer;
  function toast(key, state, params) {
    say('toast', key, state, params);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { delete messages.toast; paint('toast'); }, 3500);
  }

  function setLang(next) {
    lang = i18n.normalize(next);
    const saved = store.save({ lang });
    render();
    toast(saved ? 'lang.changed' : 'prefs.checkFail', saved ? 'ok' : 'bad');
  }

  function route() {
    const wanted = location.hash.slice(1);
    if (wanted === 'main') return; // the skip link is not a page
    const match = /^(person|account)-([a-f0-9]+)$/.exec(wanted);
    const current = match ? match[1] : ROUTES.includes(wanted) ? wanted : 'dashboard';
    const section = match ? 'accounts' : current;
    $$('dialog[open]').forEach((d) => d.close());
    if (ui) {
      ui.showPerson(current === 'person' ? match[2] : null);
      ui.showAccount(current === 'account' ? match[2] : null);
    }
    $$('[data-page]').forEach((p) => { p.hidden = p.dataset.page !== current; });
    $$('[data-route]').forEach((a) => {
      if (a.dataset.route === section) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    $('#more-btn').classList.toggle('active', !TABS.includes(section));
    window.scrollTo(0, 0);
  }

  let onConfirm = null;
  function confirm(titleKey, messageKey, action, params) {
    onConfirm = action;
    [['#confirm-title', titleKey], ['#confirm-message', messageKey]].forEach(([id, key]) => {
      $(id).textContent = t(key, params);
    });
    $('#confirm-dialog').showModal();
  }
  function clearMessage(id) { delete messages[id]; paint(id); }

  function init() {
    buildNav();
    ui = window.ACC.accountsUI.create({ t, getLang: () => lang, toast, say, clearMessage, confirm, prefs: store });
    $('#lang-btn').addEventListener('click', () => setLang(lang === 'ar' ? 'en' : 'ar'));
    $('#more-btn').addEventListener('click', () => $('#more-dialog').showModal());
    $('#more-close').addEventListener('click', () => $('#more-dialog').close());
    // Close on tap too: tapping the current page's link fires no hashchange.
    $('#more-links').addEventListener('click', (e) => { if (e.target.closest('a')) $('#more-dialog').close(); });
    $('#check-btn').addEventListener('click', () => {
      const ok = store.selfTest();
      say('check-result', ok ? 'prefs.checkOk' : 'prefs.checkFail', ok ? 'ok' : 'bad');
    });
    $('#amount-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const r = validation.parseAmount($('#amount-input').value);
      $('#amount-input').setAttribute('aria-invalid', String(!r.ok));
      if (r.ok) say('amount-result', 'amount.ok', 'ok', { value: validation.formatMinor(r.minor) });
      else say('amount-result', r.error, 'bad');
    });
    // The confirm step is built into the page: some embedded viewers block window.confirm().
    $('#reset-btn').addEventListener('click', () => confirm('reset.title', 'reset.confirm', () => {
      const ok = store.reset();
      if (ok) lang = 'ar';
      render();
      toast(ok ? 'reset.done' : 'reset.fail', ok ? 'ok' : 'bad');
    }));
    $('#confirm-no').addEventListener('click', () => $('#confirm-dialog').close());
    $('#confirm-yes').addEventListener('click', () => {
      const action = onConfirm;
      onConfirm = null;
      $('#confirm-dialog').close();
      if (action) action();
    });
    window.addEventListener('hashchange', route);
    render();
    route();
    document.documentElement.classList.add('ready');
    ui.init();
  }
  init();
})();
</script>
</body>
</html>
